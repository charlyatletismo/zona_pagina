<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zona Atletismo - Novedades 2026</title>

  <style>
    :root{
      --negro: #000000;
      --rojo: #FA4D25;
      --blanco: #ffffff;
    }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(145deg, #000000, #1a0603, #FA4D25);
      background-size: 180% 180%;
      animation: bgMove 10s ease-in-out infinite;
      color: var(--blanco);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
      text-align:center;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container{
      width:100%;
      max-width:650px;
      padding:20px;
      animation: fadeIn 1.3s ease forwards;
      opacity:0;
    }

    @keyframes fadeIn {
      from { opacity:0; transform: translateY(20px); }
      to { opacity:1; transform: translateY(0); }
    }

    img.logo{
      width: clamp(180px, 40vw, 260px);
      margin-bottom: 20px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    h1{
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom:10px;
      color: var(--rojo);
      letter-spacing:1px;
    }

    p{
      font-size: clamp(16px, 4vw, 22px);
      margin: 10px 0;
    }

    a.whatsapp{
      display:inline-block;
      margin-top:25px;
      padding: clamp(12px, 3vw, 16px) clamp(18px, 4vw, 26px);
      font-size: clamp(16px, 4vw, 22px);
      font-weight:bold;
      background: var(--rojo);
      color: var(--negro);
      border-radius:10px;
      text-decoration:none;
      transition:0.2s;
      animation: fadeIn 1.8s ease forwards;
      opacity:0;
    }

    a.whatsapp:hover{
      background:#ff6039;
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGO DESDE LA CARPETA /images -->
    <img src="images/logozona1.png" alt="Zona Atletismo" class="logo">

    <h1>ZONA ATLETISMO</h1>

    <p><strong>Pronto se vienen las Novedades 2026</strong></p>
    <p>Mantente atento a los próximos eventos y competencias.</p>

    <a class="whatsapp" 
       href="https://wa.me/5493400660640?text=Hola%20Zona%20Atletismo%2C%20quiero%20info%20de%20las%20novedades%202026" 
       target="_blank">
      Escribinos por WhatsApp
    </a>
  </div>
</body>
</html>
